<header class="site-header">
  <style>
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .header-container {
      max-width: 1220px;
      margin: auto;
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
      order: 3;
      margin-right: auto;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #0f172a, #2563eb, #94a3b8);
      box-shadow:
        0 14px 30px rgba(15, 23, 42, 0.22),
        0 0 0 4px rgba(37, 99, 235, 0.08);
      flex-shrink: 0;
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
      border: 2px solid #ffffff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      order: 1;
    }

    .nav-links a {
      color: #374151;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      transition: 0.25s ease;
      position: relative;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -8px;
      width: 0;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb, #0f172a);
      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: #111827;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      order: 2;
    }

    .header-btn,
    .mobile-header-btn {
      padding: 11px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      transition: 0.25s ease;
      white-space: nowrap;
      text-align: center;
    }

    .whatsapp-btn {
      color: #ffffff;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.25);
    }

    .contact-page-btn {
      color: #ffffff !important;
      background: linear-gradient(135deg, #111827, #374151, #2563eb);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.25);
    }

    .header-btn:hover,
    .mobile-header-btn:hover {
      transform: translateY(-2px);
    }

    .mobile-actions {
      display: none;
    }

    .menu-toggle {
      display: none;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 15px;
      background: #111827;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.2);
      order: 1;
    }

    .menu-toggle span {
      width: 23px;
      height: 2px;
      background: #ffffff;
      border-radius: 999px;
      transition: 0.25s ease;
    }

    .menu-toggle.active span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    @media (max-width: 980px) {
      .header-container {
        gap: 16px;
        padding: 11px 18px;
      }

      .menu-toggle {
        display: flex;
        order: 1;
      }

      .brand {
        order: 3;
        margin-right: auto;
        margin-left: 0;
      }

      .nav-links {
        position: fixed;
        top: 92px;
        right: 18px;
        left: 18px;
        z-index: 1001;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        background: rgba(255, 255, 255, 0.98);
        padding: 18px;
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22);
        border: 1px solid #e5e7eb;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-12px);
        pointer-events: none;
        transition: 0.25s ease;
      }

      .nav-links.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
        pointer-events: auto;
      }

      .nav-links a {
        padding: 15px 16px;
        border-radius: 16px;
        font-size: 18px;
        color: #111827;
      }

      .nav-links a:hover {
        background: #f3f4f6;
      }

      .nav-links a::after {
        display: none;
      }

      .header-actions {
        display: none;
      }

      .mobile-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 12px;
      }

      .mobile-header-btn {
        display: block;
        padding: 14px 16px;
        font-size: 17px;
        border-radius: 18px;
      }

      .brand-logo {
        width: 62px;
        height: 62px;
      }
    }

    @media (max-width: 430px) {
      .header-container {
        padding: 10px 14px;
        gap: 10px;
      }

      .brand-logo {
        width: 60px;
        height: 60px;
      }

      .nav-links {
        top: 84px;
        right: 12px;
        left: 12px;
      }
    }

    @media (max-width: 360px) {
      .brand-logo {
        width: 56px;
        height: 56px;
      }

      .menu-toggle {
        width: 44px;
        height: 44px;
      }
    }
  </style>

  <div class="header-container">
    <button class="menu-toggle" id="menuToggle" aria-label="فتح وإغلاق القائمة" type="button">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" id="navLinks">
      <a href="index.html#home">الرئيسية</a>
      <a href="index.html#products">المنتجات</a>
      <a href="index.html#quote">طلب عرض سعر</a>
      <a href="about.html">من نحن</a>
      <a href="contact.html">اتصل بنا</a>

      <div class="mobile-actions">
        <a class="mobile-header-btn whatsapp-btn" href="https://wa.me/966531021644" target="_blank">واتساب الآن</a>
      </div>
    </nav>

    <div class="header-actions">
      <a class="header-btn whatsapp-btn" href="https://wa.me/966531021644" target="_blank">واتساب</a>
      <a class="header-btn contact-page-btn" href="contact.html">اتصل بنا</a>
    </div>

    <a href="index.html#home" class="brand" aria-label="العودة للرئيسية">
      <div class="brand-logo">
        <img src="media/shar.jpeg" alt="شعار ورشة الدب القطبي للصناعة">
      </div>
    </a>
  </div>

  <script>
    function initHeaderMenu() {
      const menuToggle = document.getElementById("menuToggle");
      const navLinks = document.getElementById("navLinks");

      if (!menuToggle || !navLinks) return;

      function closeMenu() {
        navLinks.classList.remove("active");
        menuToggle.classList.remove("active");
      }

      menuToggle.addEventListener("click", function (event) {
        event.stopPropagation();
        navLinks.classList.toggle("active");
        menuToggle.classList.toggle("active");
      });

      navLinks.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      navLinks.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", closeMenu);
      });

      document.addEventListener("click", closeMenu);
      window.addEventListener("scroll", closeMenu);
    }

    initHeaderMenu();
  </script>
</header>
